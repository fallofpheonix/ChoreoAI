[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "choreoai"
version = "0.1.0"
description = "Multimodal-to-motion translation framework for AI-enabled choreography"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ChoreoAI Contributors" }
]
keywords = ["dance", "motion", "diffusion", "multimodal", "choreography"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "torch>=2.1",
    "torchvision>=0.16",
    "torchaudio>=2.1",
    "transformers>=4.35",
    "timm>=0.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "einops>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
pose = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]

[project.scripts]
choreoai = "choreoai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
